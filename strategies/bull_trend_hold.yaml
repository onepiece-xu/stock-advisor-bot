# 趋势持股策略 —— 上班族首选
# 适用场景：已有浮盈、趋势向上的持仓，判断是继续持有还是减仓止盈

name: bull_trend_hold
display_name: 趋势持有
description: 对已有浮盈的持仓，判断趋势是否延续、何时止盈。上班族不适合频繁操作，只做关键决策。
category: trend
core_rules: [2, 7]

instructions: |
  **趋势持有策略**

  适用条件：持仓盈亏 > 5%，价格站上 MA20，相对大盘偏强。

  判断标准：

  1. **继续持有**（满足任两项）：
     - 现价 > MA15 且 MA15 斜率向上
     - 近5日未出现放量滞涨（量比 > 1.5 但涨幅 < 1%）
     - 相对大盘强弱 > 0（跑赢大盘）
     - 未触发止损（距止损线 > 3%）

  2. **考虑止盈**（满足任一项）：
     - 浮盈超过 15%，建议卖出 1/3 锁定利润
     - 高位出现长上影线（当日振幅 > 5% 且收盘在日内低位）
     - 连续 3 日缩量上涨（量比 < 0.8 但价格新高）
     - MACD 顶背离（价格新高但 MACD 下降）

  3. **坚决不动**：
     - 价格在 MA5-MA20 之间正常波动，无异常信号
     - 上班族最大的错误就是过度交易。符合持有条件就拿着。

  操作建议格式：持有/减仓X股/全部止盈，一句话理由。
