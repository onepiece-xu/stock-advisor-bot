# 现金部署策略 —— 上班族择时入场
# 适用场景：现金占比 > 60%，寻找安全入场时机

name: cash_deploy
display_name: 现金部署
description: 现金比例过高时，在满足严格条件下择机入场。上班族不能频繁交易，只在确定性高时出手。
category: trend
core_rules: [1, 2, 3, 4, 5, 6, 7]

instructions: |
  **现金部署策略**

  适用条件：现金占总资产 > 60%，市场不处于暴跌状态。

  部署条件（必须同时满足至少 3 项）：

  1. **大盘环境安全**：
     - 上证指数未处于暴跌（日跌幅 < -1.5%）
     - 全市场上涨家数占比 > 35%
     - 基准指数未跌破 MA20

  2. **标的趋势确认**：
     - MA5 > MA10 > MA20（多头排列）
     - 现价在 MA20 之上
     - MACD 未死叉

  3. **安全买点**（满足任一项）：
     - 缩量回踩 MA10 或 MA15（量比 < 0.8）
     - 突破前期平台后回踩确认
     - 底部长阳放量（日涨幅 > 3% + 量比 > 2）

  4. **仓位控制**：
     - 单次入场不超过总资产 10%
     - 单票仓位不超过 35%
     - 首次入场后预留补仓空间（分 2-3 次建仓）

  5. **排除项**（任一命中则不入场）：
     - 深套股（盈亏 < -20%）不补仓
     - 当日涨幅超 3% 或前日涨幅超 3% 不追高——等回踩 MA10 再考虑
     - 涨跌停板不操作
     - 集合竞价/收盘前 10 分钟不操作

  6. **买入前必查事项**（任一未确认则不入场）：
     - 检查近 5 个交易日是否有除息日/除权日（除息当日不买入，等落地后确认 MA 支撑再考虑）
     - 检查是否有即将到来的解禁/业绩预告/重大公告
     - 若近 5 日涨幅 > 15%，必须等缩量回踩 MA10/MA15 才入场

  7. **现金安全原则**：
     - 现金放着不亏钱，乱买才亏
     - 不确定时不动——宁可错过，不可做错
     - 回本急不来，一笔一笔做对

  入场优先级：现有浮盈持仓（如趋势良好的票）> 已清仓但趋势转好的旧持仓 > 全新标的。

  操作建议格式：不入场（原因）/ 入场X股@Y元（原因），一句话。
