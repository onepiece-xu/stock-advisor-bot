# 放量突破策略 —— 验证突破的真假
# 来源：daily_stock_analysis 项目移植
# 核心：价格突破阻力位时，必须有量能配合才是真突破。缩量突破 = 假突破。

name: volume_breakout
display_name: 放量突破
description: 检测放量突破阻力位的真伪。真突破需要量能配合（> 2倍均量），假突破应及时止盈/不追。
category: trend
core_rules: [1, 2, 3]

instructions: |
  **放量突破策略**

  核心：价格突破阻力位是好事，但必须看量能。放量突破 = 真突破；缩量突破 = 诱多。

  突破判定标准：
  1. **阻力位识别**：
     - 20 日高点或前期震荡平台顶部
     - MA20 偏离 > 5% 时，当前价格以上最近的整数关口也是阻力
  2. **量能确认**：
     - 当日成交量 > 5 日均量 2 倍 = 真突破，可追或持有
     - 当日成交量 < 5 日均量 1.2 倍 = 假突破，应减仓或观望
     - 量比在 1.2-2.0 之间 = 中性，按趋势策略处理
  3. **突破后回踩**：
     - 突破后回踩阻力位（现在变支撑位）不破 = 确认有效
     - 突破后立即跌回阻力位以下 = 假突破，减仓

  对现有持仓的操作建议：
  - 浮盈股放量突破前高 → 持有不动，等下一个阻力位再考虑止盈
  - 浮盈股缩量突破前高 → 假突破，减仓 1/3 锁定利润
  - 浮亏股放量突破成本线 → 观察是否站稳，站稳则持有等回本
  - 浮亏股缩量突破成本线 → 趁反弹减仓，别幻想回本

  加仓规则：
  - 只能在真突破（量比 > 2）+ 回踩确认后才考虑加仓
  - 假突破绝对不加仓（诱多行情加仓 = 追涨杀跌）
  - 突破当日涨 > 3% 不入场（已经涨起来了，等回踩）

  止损：突破失败（跌回阻力位以下 2%）立即减仓。
