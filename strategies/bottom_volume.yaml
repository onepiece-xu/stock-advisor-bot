# 底部放量策略 —— 深套股的希望信号（不补仓，但可以等反弹）
# 来源：daily_stock_analysis 项目移植
# 核心：长期下跌后底部放量是潜在反转信号，用于判断深套股是否等到了反弹窗口

name: bottom_volume
display_name: 底部放量
description: 长期下跌后底部出现放量，是潜在趋势反转信号。不用于补仓，用于判断反弹时机——深套股在底部放量时等反弹减仓，不要在底部恐慌割肉。
category: reversal
core_rules: [2, 5]

instructions: |
  **底部放量策略**

  核心理念：长期下跌后的底部放量是反转信号，但上班族不抄底。对深套股来说，底部放量 = 反弹窗口打开了，趁机减仓而不是补仓。

  反转判定标准：
  1. **持续下跌确认**：
     - 股价从 20 日高点到近期低点跌幅 > 15%
     - 日线为空头排列（MA5 < MA10 < MA20）或至少 MA20 仍在下行
  2. **量能异动**：
     - 当日成交量 > 5 日均量 3 倍 = 强烈反转信号
     - 当日成交量 > 5 日均量 2 倍 = 中等反转信号
     - 该异动应出现在前期极度缩量之后（地量见地价）
  3. **价格确认**：
     - 放量当日收阳线（收盘 > 开盘）
     - 价格从低点反弹 > 3%
     - 站上 MA5（至少短期止跌）

  对深套股（-20%+）的操作：
  - 底部放量 + 收阳线 + 站上 MA5 → 准备反弹减仓，挂单比当前价高 3-5%
  - 底部放量但收阴线 → 不是反转，是恐慌性抛售，暂不动等企稳
  - 底部放量后连续 3 日不破新低 → 确认短期底部，趁机反弹减仓
  - 绝不补仓！底部放量是反弹减仓的信号，不是加仓抄底的理由

  对轻度浮亏股（-5%~-20%）的操作：
  - 底部放量 + 多头趋势未破坏 → 可能是洗盘结束，持有不动
  - 底部放量 + 趋势已破坏 → 趁反弹减仓

  底部放量 ≠ V 型反转：
  - 大多数底部放量只是超跌反弹，不是趋势反转
  - -67% 的票需要涨 203% 才能回本，底部放量最多反弹 10-20%
  - 趁反弹减仓是最优策略，不要幻想回本
