instructions: |
  **情绪周期策略 —— 逆情绪布局**

  核心哲学：市场参与者的情绪在「恐慌→悲观→怀疑→希望→乐观→兴奋→贪婪→狂热」之间循环。
  聪明钱在恐慌底部布局，在狂热顶部离场。上班族尤其要逆情绪——大家恐慌时我进场，大家狂热时我冷静。

  ## 情绪阶段判断（换手率是核心指标）

  - **换手率 < 0.5%/日**：市场冷淡，无人关注 → 潜在底部区域（别人恐慌我贪婪）
  - **换手率 0.5%-2%**：正常交投，情绪平稳 → 按趋势策略正常操作
  - **换手率 2%-5%**：活跃，市场关注度上升 → 谨慎追高，等回踩
  - **换手率 > 5%**：高热度，游资/散户涌入 → 警惕情绪顶
  - **换手率 > 10%**：极度过热 → 通常为短期顶部，应考虑减仓

  ## 情绪底部特征（买入区）—— 满足 3 项以上可考虑入场
  ✅ 成交量持续萎缩，低于近 60 日均量 50% 以上
  ✅ 近期新闻以低调、中性或偏负面为主
  ✅ 股价在 MA20 附近或以下，但未出现恐慌性暴跌
  ✅ 换手率处于低位（< 1%）
  ✅ 均线收缩（MA5/MA10/MA20 粘合），波动率降低

  ## 情绪顶部特征（减仓区）—— 满足 3 项以上应警惕
  ⚠️ 近 5 日换手率 > 近 20 日均值 2 倍
  ⚠️ 成交量脉冲式放大（单日暴量）
  ⚠️ 新闻以利好兑现、机构目标价上调、散户追捧为主
  ⚠️ 股价偏离 MA5 超过 8%（高乖离率）
  ⚠️ MACD 出现顶背离

  ## 逆情绪操作原则
  - 大众恐慌（低换手+负面新闻+价格低迷）→ 寻找入场机会
  - 大众狂热（高换手+利好兑现+价格冲高）→ 考虑减仓
  - 情绪平稳区间 → 正常操作，不逆不追
  - 上班族最大的优势：不盯盘，不容易被情绪裹挟

  ## 特殊情况（均值回归体系的核心应用）
  - 深套股（-20%+）出现情绪底部特征 → 不补仓，但可以等一等再割（等情绪回暖反弹时减仓）
  - 浮盈股出现情绪顶部特征 → 坚决止盈，不因「还能涨」而贪心
  - 大盘情绪底部 + 个股情绪底部 → 重仓信号（罕见但价值最高的机会）

  评分影响：
  - 情绪底部特征满足 3 项以上 → 买入信号应加分
  - 情绪顶部特征满足 3 项以上 → 买入信号应拒绝，卖出信号应加分
