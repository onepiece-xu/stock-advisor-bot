# 现金部署策略 —— 上班族择时入场 v2.0
# 适用场景：现金占比 > 60%，寻找安全入场时机

name: cash_deploy
display_name: 现金部署
description: 现金比例过高时，在满足严格条件下择机入场。上班族不能频繁交易，只在确定性高时出手。
category: trend
core_rules: [1, 2, 3, 4, 5, 6, 7, 8]

instructions: |
  **现金部署策略 v2.0**

  适用条件：现金占总资产 > 60%，市场不处于暴跌状态。

  **每次加仓金额规则：**
  - 总资产 < 5万：每次入场 2000-3000 元（约 50-100 股中低价票）
  - 总资产 5-10万：每次入场 4000-6000 元
  - 单次入场不超过总资产 10%
  - 首次入场后预留补仓空间（分 2-3 次建仓）
  - 当前现金 3.5万，建议单次入场 3000-4000 元

  **加仓优先级（严格按顺序）：**
  1. 现有浮盈持仓（趋势向好、有安全垫的票，优先加仓）
  2. 现有小亏持仓（-5% 以内、MA 支撑有效的票，谨慎加仓）
  3. 已清仓但趋势转好的旧持仓
  4. 全新标的（最后考虑，需要更严格的筛选）
  5. 深套股（-20%+）绝不加仓

  部署条件（必须同时满足至少 4 项）：

  1. **大盘环境安全**：
     - 上证指数未处于暴跌（日跌幅 < -1.5%）
     - 全市场上涨家数占比 > 35%
     - 基准指数未跌破 MA20

  2. **标的趋势确认**：
     - MA5 > MA10 > MA20（多头排列）
     - 现价在 MA20 之上
     - MACD 未死叉
     - 日线RSI 在 30-70 之间（不过热也不过冷）

  3. **安全买点**（满足任一项）：
     - 缩量回踩 MA10 或 MA15（量比 < 0.8）
     - 突破前期平台后回踩确认
     - 底部长阳放量（日涨幅 > 3% + 量比 > 2）
     - 日线RSI 超卖反弹（RSI < 30 后回到 30+）

  4. **仓位控制**：
     - 单次入场不超过总资产 10%
     - 单票仓位不超过 35%
     - 首次入场后预留补仓空间（分 2-3 次建仓）
     - 总仓位（所有持仓）不超过 60%

  5. **排除项**（任一命中则不入场）：
     - 深套股（盈亏 < -20%）不补仓
     - 当日涨幅超 3% 或前日涨幅超 3% 不追高——等回踩 MA10 再考虑
     - 涨跌停板不操作
     - 集合竞价/收盘前 10 分钟不操作
     - 日线RSI > 70（超买）不入场
     - 近5日涨幅 > 15% 不入场（等缩量回踩）

  6. **买入前必查事项**（任一未确认则不入场）：
     - 检查近 5 个交易日是否有除息日/除权日（除息当日不买入）
     - 检查是否有即将到来的解禁/业绩预告/重大公告
     - 若近 5 日涨幅 > 15%，必须等缩量回踩 MA10/MA15 才入场

  7. **现金安全原则**：
     - 现金放着不亏钱，乱买才亏
     - 不确定时不动——宁可错过，不可做错
     - 回本急不来，一笔一笔做对
     - 每笔买入必须先想好「如果跌了怎么办」

  8. **当前优先加仓标的**（基于现有持仓 2026-05-13）：
     - 中国卫通(601698)：浮盈 +4.3%，趋势向好，优先考虑加仓
     - 中兴通讯(000063)：浮亏 -1.4%，MA 支撑尚可，等确认企稳后再加
     - 南网能源(003035)：浮亏 -67.2%，绝不加仓，只等反弹减仓

  入场优先级：中国卫通（浮盈+趋势好）> 中兴通讯（小亏+等企稳）> 全新标的 > 南网能源（永不补仓）。

  操作建议格式：不入场（原因）/ 入场X股@Y元（原因），一句话。
