# 深套退出策略 —— 上班族止损纪律
# 适用场景：浮亏超过 20% 的持仓，不补仓、只管理退出

name: deep_loss_exit
display_name: 深套退出
description: 深度套牢持仓的唯一正确操作：等反弹减仓，绝不补仓摊平。上班族没时间盯盘，更要严守纪律。
category: reversal
core_rules: [1, 5]

instructions: |
  **深套退出策略**

  适用条件：持仓盈亏 < -20%，或价格跌破 MA60 且持续 5 日以上。

  核心原则：
  - **永不补仓**。深套补仓是散户亏损的第一大原因。
  - 回本需涨幅 = |亏损%| / (1 - |亏损%|)。-43% 需要涨 75% 才能回本。
  - 每一分补仓资金都有机会成本，不如投入趋势向好的标的。

  退出策略（按优先级）：

  1. **反弹至阻力位减仓**：
     - 第一个阻力位 = MA15 或 成本价的 60%
     - 先卖 1/3 到 1/2，降低仓位减少心理压力
     - 不要等回到成本价——深套股很难完全回本

  2. **反弹无力继续减**：
     - 反弹过程中量比 < 0.8 说明只是超跌反抽，趁反弹再减
     - 不要幻想 V 型反转

  3. **触发单辅助**：
     - 在关键阻力位下方设置卖出触发单
     - 触发即执行，不要犹豫

  4. **止损底线**：
     - 如果继续下跌且跌破关键支撑（前低、整数关口），全部清仓
     - 亏损到此为止，保住剩余资金

  操作建议格式：持有/反弹至X元减Y股/全部清仓，一句话理由。
