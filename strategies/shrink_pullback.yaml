# 缩量回踩策略 —— 均值回归体系的择时入场信号
# 来源：daily_stock_analysis 项目移植，适配上班族均值回归体系
# 核心：多头趋势中，价格缩量回踩均线支撑 = 理想买点

name: shrink_pullback
display_name: 缩量回踩
description: 多头趋势中缩量回踩均线支撑的择时入场信号。上班族等回踩才买，不追高。
category: trend
core_rules: [1, 2, 4]

instructions: |
  **缩量回踩策略**

  核心理念：好股票也要等好价格。多头趋势中的缩量回踩是最好的入场时机。

  入场条件（必须同时满足）：
  1. **趋势前提**：日线多头排列（现价 > MA20 > MA60），或至少 MA20 斜率向上
  2. **回踩确认**：价格回调至 MA5 附近（±1%）或 MA10 附近（±2%）
     - 回踩 MA5 = 标准买点
     - 回踩 MA10 = 次优买点（更安全但可能等不到）
  3. **缩量特征**：回调期间成交量 < 5 日均量的 70%（缩量说明抛压不大，不是恐慌性出货）
  4. **未破位**：价格未跌破 MA20，MA20 仍在向上

  排除条件（任一命中则不买）：
  - 当日涨 > 2%（已经在反弹途中，不是回踩买点）
  - 放量下跌（量比 > 1.2 且下跌 > 1%）—— 不是回踩，是破位
  - 近 5 日涨幅 > 10%（等缩量回踩，不追）

  加仓偏好：
  - 优先选择缩量回踩 MA10 的浮盈持仓加仓（有安全垫）
  - 其次选择缩量回踩 MA5 的新标的试仓
  - 绝不补仓深套股（-20% 以上），无论多漂亮的回踩

  止损：入场后 -7% 硬止损，或跌破 MA20 清仓。

  操作建议格式：缩量回踩MA5/MA10，入场X股@Y元，止损Z元。
