# 深套退出策略 —— 上班族结构化退出路线图
# 适用场景：浮亏超过 20% 的持仓，不补仓、只管理退出

name: deep_loss_exit
display_name: 深套退出
description: 深度套牢持仓的唯一正确操作：等反弹减仓，绝不补仓摊平。上班族没时间盯盘，更要严守纪律。
category: reversal
core_rules: [1, 2, 3, 4, 5]

instructions: |
  **深套退出策略 v2.0 — 结构化退出路线图**

  适用条件：持仓盈亏 < -20%，或价格跌破 MA60 且持续 5 日以上。

  核心原则：
  - **永不补仓**。深套补仓是散户亏损的第一大原因。
  - 回本需涨幅 = |亏损%| / (1 - |亏损%|)。-67% 需要涨 203% 才能回本，基本不可能。
  - 每一分补仓资金都有机会成本，不如投入趋势向好的标的。
  - 目标不是回本，是止损保命。

  **结构化退出路线图（必须严格执行）：**

  第一步：确定关键价位
  - 最近5日最高价 = 反弹第一目标
  - MA15（日线）= 中线阻力位
  - 成本价的 50% = 心理关口（如成本 25.24，则 12.62）
  - 前低支撑（如当前价 8.29，支撑约 7.50-8.00）
  - 整数关口（7.00, 8.00, 9.00, 10.00）

  第二步：制定退出计划
  场景A：强势反弹（当日涨幅 > 3% 且量比 > 1.5）
  - 反弹至 9.00-9.50 卖 50 股（减半仓）
  - 反弹至 10.00-10.50 卖剩余 50 股（清仓）
  - 反弹至 MA15 附近全部清仓

  场景B：温和反弹（当日涨幅 1-3%）
  - 反弹至 8.50-9.00 卖 50 股
  - 剩余 50 股观望，若再跌回 8.00 以下全部清仓

  场景C：继续下跌（跌破 7.50）
  - 全部清仓，亏损到此为止
  - 保住剩余资金的购买力

  第三步：反弹无力继续减
  - 反弹过程中量比 < 0.8 说明只是超跌反抽，趁反弹全仓出
  - 不要幻想 V 型反转——-67% 的票没有 V 型反转
  - 不要在「等一等就回本了」的幻想中越套越深

  第四步：止损底线
  - 跌破前低支撑（~7.50）全部清仓
  - 跌破整数关口 7.00 无条件清仓
  - 亏损到此为止，保住剩余资金

  退出后纪律：
  - 至少等 20 个交易日再考虑是否重新入场
  - 重新入场条件：站上 MA20 + MA20 拐头向上 + 量比 > 1.2
  - 删除此标的触发单，不让它再出现在监控列表

  操作建议格式：当前价/反弹目标/卖出数量/理由，一句话。
